name: Bug report
description: Report a reproducible problem using synthetic data
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach exports, ZIPs, tokens, cookies, HAR files, private
        conversation content, identifiers, or signed URLs. For vulnerabilities,
        follow SECURITY.md.
  - type: checkboxes
    attributes:
      label: Private data check
      options:
        - label: This report contains no credentials or private data.
          required: true
  - type: input
    attributes:
      label: Version and environment
      description: Commit, OS, Python version; no private paths.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Mode
      options:
        - Live web export
        - Offline import
        - Local index
        - Attachment backfill
        - ZIP backup or restore
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps and synthetic reproduction
      description: Use fake input. Remove personal paths and identifiers.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual result
      description: Include exit status and counts, not private records.
    validations:
      required: true
