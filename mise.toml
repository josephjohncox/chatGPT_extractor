min_version = "2026.9.11"

[tool_config]
locked = true

[settings]
lockfile = true

[tools]
python = "3.13.9"
uv = "0.12.22"
"aqua:gitleaks/gitleaks" = "8.30.1"

[env]
PYTHONUTF8 = "1"

[tasks.deps]
description = "Synchronize locked Python dependencies (uv owns .venv)"
run = "uv sync --locked"

[tasks.export]
description = "Snapshot conversations, available memories/instructions/settings, and local HTML using private credentials"
run = "uv run --locked -- python chatgpt_exporter.py export"

[tasks.probe]
description = "Read-only endpoint/authentication check; prints shapes, never tokens/content"
run = "uv run --locked -- python chatgpt_exporter.py probe"

[tasks.import]
description = "Convert an official JSON/ZIP export offline; pass archive path and options"
run = "uv run --locked -- python chatgpt_exporter.py import"

[tasks.attachments]
description = "Backfill images/files/artifacts from existing raw JSON without re-exporting conversations"
run = "uv run --locked -- python chatgpt_exporter.py attachments"

[tasks.index]
description = "Build an offline HTML chat/project index from existing exports (no credentials or network)"
run = "uv run --locked -- python chatgpt_exporter.py index"

[tasks.zip]
description = "Back up the output directory as a private ZIP; keep the original directory"
run = "uv run --locked -- python chatgpt_exporter.py zip"

[tasks.unzip]
description = "Restore a backup into a new directory; keep the ZIP and existing output"
run = "uv run --locked -- python chatgpt_exporter.py unzip"

[tasks.secrets]
description = "Scan all fetched Git history for secrets with redacted output"
run = "gitleaks git . --log-opts=--all --redact=100 --no-banner"

[tasks.test]
description = "Run offline tests (no account or network required)"
run = "uv run --locked -- pytest"

[tasks.lint]
description = "Check Python source with locked Ruff"
run = "uv run --locked -- ruff check ."

[tasks.format]
description = "Format Python source"
run = "uv run --locked -- ruff format ."

[tasks."format:check"]
description = "Check Python formatting without mutation"
run = "uv run --locked -- ruff format --check ."

[tasks.typecheck]
description = "Check application types"
run = "uv run --locked -- mypy chatgpt_exporter.py chatgpt_client.py export_config.py conversation_format.py export_io.py local_index.py progress_report.py attachment_refs.py attachment_transport.py attachments.py attachment_view.py canvas_artifacts.py retry_control.py archive_backup.py"

[tasks.check]
description = "Run offline quality gates"
depends = ["lint", "format:check", "typecheck", "test"]
