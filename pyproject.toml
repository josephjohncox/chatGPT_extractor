[project]
name = "chatgpt-extractor"
version = "0.1.0"
description = "Read-only ChatGPT web exporter and offline data-export converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33.0,<3",
    "rich>=14,<16",
    "regex>=2025.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "types-requests>=2.32",
    "types-regex>=2025.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["chatgpt_export", "chatgpt_export_hadrian"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
